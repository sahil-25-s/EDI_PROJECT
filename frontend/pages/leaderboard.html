<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Codecade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background: #000 url('/assets/images/background.jpg') center center / cover no-repeat fixed;
            color: #e0e0e0;
            font-size: 1.25rem;
        }

        .retro-panel {
            background: linear-gradient(135deg, rgba(75, 46, 114, 0.9), rgba(46, 26, 71, 0.9));
            border: 4px solid #9932cc;
            box-shadow: 0 0 15px #9932cc;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .retro-btn {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border: 3px solid #da70d6;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            color: #da70d6;
            background: transparent;
        }

        .retro-btn:hover {
            background: #da70d6;
            color: #1a0a2e;
            box-shadow: 0 0 20px #da70d6;
        }

        .text-glow-pink { color: #ff1493; text-shadow: 0 0 10px #ff1493; }
        .text-glow-purple { color: #9932cc; text-shadow: 0 0 10px #9932cc; }
        .text-glow-gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .text-glow-silver { color: #c0c0c0; text-shadow: 0 0 10px #c0c0c0; }
        .text-glow-bronze { color: #cd7f32; text-shadow: 0 0 10px #cd7f32; }

        .leaderboard-item {
            background: rgba(75, 46, 114, 0.6);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            border-color: #da70d6;
            background: rgba(75, 46, 114, 0.8);
        }

        .rank-1 { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        .rank-2 { border-color: #c0c0c0; background: rgba(192, 192, 192, 0.1); }
        .rank-3 { border-color: #cd7f32; background: rgba(205, 127, 50, 0.1); }

        .rank-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .rank-1 .rank-badge { background: #ffd700; color: #000; }
        .rank-2 .rank-badge { background: #c0c0c0; color: #000; }
        .rank-3 .rank-badge { background: #cd7f32; color: #fff; }
        .rank-other .rank-badge { background: #444; color: #fff; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="retro-panel">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl text-glow-pink">🏆 LEADERBOARD</h1>
            <div class="flex gap-2">
                <a href="index.html" class="retro-btn text-sm">← HOME</a>
                <button id="refreshBtn" class="retro-btn text-sm">REFRESH</button>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4">
        <!-- Top 3 -->
        <div class="retro-panel">
            <h2 class="text-2xl text-glow-purple mb-6 text-center">TOP CODERS</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="topThree">
                <!-- Top 3 will be loaded here -->
            </div>
        </div>

        <!-- Full Leaderboard -->
        <div class="retro-panel">
            <h2 class="text-xl text-glow-purple mb-4">FULL RANKINGS</h2>
            <div id="leaderboardList">
                <!-- Leaderboard will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_BASE}/api/leaderboard`);
                const leaderboard = await response.json();

                renderTopThree(leaderboard.slice(0, 3));
                renderFullLeaderboard(leaderboard);

            } catch (error) {
                console.error('Failed to load leaderboard:', error);
                // Show mock data
                const mockData = [
                    { rank: 1, username: 'CodeMaster', level: 15, xp: 1500, battleRating: 1800, battleWins: 25, battleLosses: 5 },
                    { rank: 2, username: 'AlgoNinja', level: 12, xp: 1200, battleRating: 1650, battleWins: 20, battleLosses: 8 },
                    { rank: 3, username: 'DataWiz', level: 10, xp: 1000, battleRating: 1500, battleWins: 15, battleLosses: 10 },
                    { rank: 4, username: 'TestPlayer', level: 1, xp: 0, battleRating: 1200, battleWins: 0, battleLosses: 0 }
                ];
                renderTopThree(mockData.slice(0, 3));
                renderFullLeaderboard(mockData);
            }
        }

        function renderTopThree(topThree) {
            const container = document.getElementById('topThree');
            
            container.innerHTML = topThree.map((player, index) => {
                const position = index + 1;
                const medal = position === 1 ? '🥇' : position === 2 ? '🥈' : '🥉';
                const glowClass = position === 1 ? 'text-glow-gold' : 
                                position === 2 ? 'text-glow-silver' : 'text-glow-bronze';
                
                return `
                    <div class="text-center p-4 border-2 border-${position === 1 ? 'yellow' : position === 2 ? 'gray' : 'orange'}-500 rounded-lg">
                        <div class="text-4xl mb-2">${medal}</div>
                        <h3 class="text-xl ${glowClass} mb-2">${player.username}</h3>
                        <div class="space-y-1 text-sm">
                            <div>Level ${player.level}</div>
                            <div>${player.xp} XP</div>
                            <div>Rating: ${player.battleRating}</div>
                            <div class="text-green-400">${player.battleWins}W-${player.battleLosses}L</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderFullLeaderboard(leaderboard) {
            const container = document.getElementById('leaderboardList');
            
            container.innerHTML = leaderboard.map(player => {
                const rankClass = player.rank <= 3 ? `rank-${player.rank}` : 'rank-other';
                const winRate = player.battleWins + player.battleLosses > 0 ? 
                    Math.round((player.battleWins / (player.battleWins + player.battleLosses)) * 100) : 0;
                
                return `
                    <div class="leaderboard-item ${rankClass} flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="rank-badge">${player.rank}</div>
                            <div>
                                <div class="text-lg font-bold">${player.username}</div>
                                <div class="text-sm text-gray-400">Level ${player.level} • ${player.xp} XP</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-lg">⚔️ ${player.battleRating}</div>
                            <div class="text-sm text-gray-400">${player.battleWins}W-${player.battleLosses}L (${winRate}%)</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('refreshBtn').addEventListener('click', loadLeaderboard);

        loadLeaderboard();
    </script>
</body>
</html>
