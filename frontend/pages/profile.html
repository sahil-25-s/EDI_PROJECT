<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Codecade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background: #000 url('/assets/images/background.jpg') center center / cover no-repeat fixed;
            color: #e0e0e0;
            font-size: 1.25rem;
        }

        .retro-panel {
            background: linear-gradient(135deg, rgba(75, 46, 114, 0.9), rgba(46, 26, 71, 0.9));
            border: 4px solid #9932cc;
            box-shadow: 0 0 15px #9932cc;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .retro-btn {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border: 3px solid #da70d6;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            color: #da70d6;
            background: transparent;
        }

        .retro-btn:hover {
            background: #da70d6;
            color: #1a0a2e;
            box-shadow: 0 0 20px #da70d6;
        }

        .retro-input {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            background: rgba(46, 26, 71, 0.8);
            border: 2px solid #9932cc;
            color: #c084fc;
            padding: 0.75rem;
            border-radius: 6px;
            width: 100%;
            outline: none;
        }

        .retro-input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .text-glow-pink { color: #ff1493; text-shadow: 0 0 10px #ff1493; }
        .text-glow-purple { color: #9932cc; text-shadow: 0 0 10px #9932cc; }
        .text-glow-cyan { color: #67e8f9; text-shadow: 0 0 10px #06b6d4; }

        .stat-card {
            background: rgba(75, 46, 114, 0.6);
            border: 2px solid #da70d6;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ff69b4;
            background: linear-gradient(135deg, #ff1493, #9932cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="retro-panel">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl text-glow-pink">PLAYER PROFILE</h1>
            <div class="flex gap-2">
                <a href="index.html" class="retro-btn text-sm">← HOME</a>
                <a href="dashboard.html" class="retro-btn text-sm">DASHBOARD</a>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4">
        <!-- Profile Info -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- User Card -->
            <div class="retro-panel text-center">
                <div class="avatar" id="userAvatar">👤</div>
                <h2 class="text-2xl text-glow-purple mb-2" id="username">Loading...</h2>
                <p class="text-gray-300 mb-4" id="userEmail">Loading...</p>
                <div class="space-y-2">
                    <div class="text-glow-cyan">Level <span id="userLevel">1</span></div>
                    <div class="text-sm text-gray-400"><span id="userXP">0</span> XP</div>
                    <div class="text-sm text-gray-400">Battle Rating: <span id="battleRating">1200</span></div>
                </div>
            </div>

            <!-- Stats -->
            <div class="lg:col-span-2">
                <div class="retro-panel">
                    <h3 class="text-xl text-glow-pink mb-4">STATISTICS</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="stat-card">
                            <div class="text-2xl text-glow-pink" id="problemsSolved">0</div>
                            <div class="text-sm">Problems Solved</div>
                        </div>
                        <div class="stat-card">
                            <div class="text-2xl text-glow-purple" id="lessonsCompleted">0</div>
                            <div class="text-sm">Lessons Done</div>
                        </div>
                        <div class="stat-card">
                            <div class="text-2xl text-glow-cyan" id="battleWins">0</div>
                            <div class="text-sm">Battle Wins</div>
                        </div>
                        <div class="stat-card">
                            <div class="text-2xl text-glow-pink" id="streakDays">0</div>
                            <div class="text-sm">Day Streak</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Profile -->
        <div class="retro-panel">
            <h3 class="text-xl text-glow-pink mb-4">EDIT PROFILE</h3>
            <form id="profileForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-2">Username</label>
                        <input type="text" id="editUsername" class="retro-input" required>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">College</label>
                        <input type="text" id="editCollege" class="retro-input" placeholder="Optional">
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button type="submit" class="retro-btn">UPDATE PROFILE</button>
                    <button type="button" id="changePasswordBtn" class="retro-btn">CHANGE PASSWORD</button>
                    <button type="button" id="deleteProfileBtn" class="retro-btn" style="border-color: #ff1493; color: #ff1493;">DELETE PROFILE</button>
                </div>
            </form>
        </div>
        

    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const AUTH_TOKEN = localStorage.getItem('token') || '';
        
        if (!AUTH_TOKEN) {
            window.location.href = 'index.html';
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                const user = await response.json();

                document.getElementById('username').textContent = user.username;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userLevel').textContent = user.level;
                document.getElementById('userXP').textContent = user.xp;
                document.getElementById('battleRating').textContent = user.battle_rating;
                document.getElementById('editUsername').value = user.username;
                document.getElementById('editCollege').value = user.college || '';

                // Load stats
                const statsResponse = await fetch(`${API_BASE}/api/user/stats`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                const stats = await statsResponse.json();

                document.getElementById('problemsSolved').textContent = stats.problemsSolved;
                document.getElementById('lessonsCompleted').textContent = stats.lessonsCompleted;
                document.getElementById('battleWins').textContent = user.battle_wins;
                document.getElementById('streakDays').textContent = stats.currentStreak;

            } catch (error) {
                console.error('Failed to load profile:', error);
                alert('Failed to load profile data');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('editUsername').value;
            const college = document.getElementById('editCollege').value;

            try {
                const response = await fetch(`${API_BASE}/api/user/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({ username, college })
                });

                if (response.ok) {
                    alert('Profile updated successfully!');
                    loadProfile();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.error);
                }
            } catch (error) {
                console.error('Update error:', error);
                alert('Failed to update profile');
            }
        });

        document.getElementById('changePasswordBtn').addEventListener('click', () => {
            alert('Password change feature coming soon!');
        });

        document.getElementById('deleteProfileBtn').addEventListener('click', async () => {
            if (!confirm('⚠️ WARNING: This will permanently delete your account and all data. This action cannot be undone!\n\nType "DELETE" to confirm:')) {
                return;
            }
            
            const confirmation = prompt('Type DELETE to confirm account deletion:');
            if (confirmation !== 'DELETE') {
                alert('Account deletion cancelled.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/user/profile`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                
                if (response.ok) {
                    alert('Your account has been deleted.');
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'index.html';
                } else {
                    alert('Failed to delete account. Please try again.');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete account. Please try again.');
            }
        });

        loadProfile();
    </script>
</body>
</html>
