<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn - Codecade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background: #000 url('/assets/images/background.jpg') center center / cover no-repeat fixed;
            color: #e0e0e0;
            font-size: 1.25rem;
        }

        .retro-panel {
            background: linear-gradient(135deg, rgba(75, 46, 114, 0.9), rgba(46, 26, 71, 0.9));
            border: 4px solid #9932cc;
            box-shadow: 0 0 15px #9932cc;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .retro-btn {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border: 3px solid #da70d6;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            color: #da70d6;
            background: transparent;
        }

        .retro-btn:hover {
            background: #da70d6;
            color: #1a0a2e;
            box-shadow: 0 0 20px #da70d6;
        }

        .text-glow-pink { color: #ff1493; text-shadow: 0 0 10px #ff1493; }
        .text-glow-purple { color: #9932cc; text-shadow: 0 0 10px #9932cc; }
        .text-glow-cyan { color: #67e8f9; text-shadow: 0 0 10px #06b6d4; }

        .lesson-card {
            background: rgba(75, 46, 114, 0.6);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 105, 180, 0.1), transparent);
            transition: left 0.5s;
        }

        .lesson-card:hover::before {
            left: 100%;
        }

        .lesson-card:hover {
            border-color: #da70d6;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(218, 112, 214, 0.3);
        }

        .lesson-completed {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .difficulty-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .diff-beginner { background: #10b981; color: #000; }
        .diff-intermediate { background: #f59e0b; color: #000; }
        .diff-advanced { background: #ef4444; color: #fff; }

        .category-filter {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #444;
            background: transparent;
            color: #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
        }

        .filter-btn.active {
            border-color: #da70d6;
            color: #da70d6;
            background: rgba(218, 112, 214, 0.1);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="retro-panel">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl text-glow-pink">📚 LEARN DSA</h1>
            <div class="flex gap-2">
                <a href="index.html" class="retro-btn text-sm">← HOME</a>
                <a href="practice-new.html" class="retro-btn text-sm">PRACTICE</a>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4">
        <!-- Category Filters -->
        <div class="retro-panel">
            <h2 class="text-xl text-glow-purple mb-4">CATEGORIES</h2>
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">All Topics</button>
                <button class="filter-btn" data-category="Arrays">Arrays</button>
                <button class="filter-btn" data-category="Data Structures">Data Structures</button>
                <button class="filter-btn" data-category="Algorithms">Algorithms</button>
                <button class="filter-btn" data-category="Dynamic Programming">Dynamic Programming</button>
            </div>
        </div>

        <!-- Lessons Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="lessonsGrid">
            <!-- Lessons will be loaded here -->
        </div>
    </div>

    <!-- Lesson Modal -->
    <div id="lessonModal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50">
        <div class="retro-panel max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl text-glow-pink" id="modalTitle">Lesson Title</h3>
                <button id="closeModal" class="text-2xl text-glow-purple">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4">
                <!-- Lesson content will be loaded here -->
            </div>
            <div class="flex justify-between items-center mt-6">
                <div class="text-sm text-gray-400">
                    XP Reward: <span class="text-glow-cyan" id="xpReward">25</span>
                </div>
                <button id="completeBtn" class="retro-btn">COMPLETE LESSON</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const AUTH_TOKEN = localStorage.getItem('token') || '';
        
        if (!AUTH_TOKEN) {
            window.location.href = 'index.html';
        }

        let lessons = [];
        let currentLesson = null;
        let currentFilter = 'all';

        async function loadLessons() {
            try {
                const response = await fetch(`${API_BASE}/api/lessons`);
                lessons = await response.json();
                renderLessons();
            } catch (error) {
                console.error('Failed to load lessons:', error);
                // Mock data fallback
                lessons = [
                    { id: 'arrays-basics', title: 'Arrays Fundamentals', category: 'Arrays', difficulty: 'Beginner', content: 'Learn the basics of arrays, indexing, and common operations.', xpReward: 25, completed: false },
                    { id: 'linked-lists', title: 'Linked Lists', category: 'Data Structures', difficulty: 'Beginner', content: 'Understanding linked lists, nodes, and basic operations.', xpReward: 30, completed: false },
                    { id: 'stacks-queues', title: 'Stacks and Queues', category: 'Data Structures', difficulty: 'Intermediate', content: 'Learn about LIFO and FIFO data structures.', xpReward: 35, completed: false },
                    { id: 'binary-search', title: 'Binary Search', category: 'Algorithms', difficulty: 'Intermediate', content: 'Master the binary search algorithm and its applications.', xpReward: 40, completed: false },
                    { id: 'sorting-algorithms', title: 'Sorting Algorithms', category: 'Algorithms', difficulty: 'Intermediate', content: 'Compare different sorting algorithms and their complexities.', xpReward: 45, completed: false }
                ];
                renderLessons();
            }
        }

        function renderLessons() {
            const container = document.getElementById('lessonsGrid');
            const filteredLessons = currentFilter === 'all' ? 
                lessons : lessons.filter(l => l.category === currentFilter);

            container.innerHTML = filteredLessons.map(lesson => `
                <div class="lesson-card ${lesson.completed ? 'lesson-completed' : ''}" onclick="openLesson('${lesson.id}')">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-lg font-bold">${lesson.title}</h3>
                        <span class="text-2xl">${lesson.completed ? '✅' : '📖'}</span>
                    </div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="difficulty-badge diff-${lesson.difficulty.toLowerCase()}">${lesson.difficulty}</span>
                        <span class="text-sm text-gray-400">${lesson.category}</span>
                    </div>
                    <p class="text-sm text-gray-300 mb-3">${lesson.content}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-glow-cyan">+${lesson.xpReward} XP</span>
                        <span class="text-sm text-gray-400">${lesson.completed ? 'Completed' : 'Not Started'}</span>
                    </div>
                </div>
            `).join('');
        }

        function openLesson(lessonId) {
            currentLesson = lessons.find(l => l.id === lessonId);
            if (!currentLesson) return;

            document.getElementById('modalTitle').textContent = currentLesson.title;
            document.getElementById('xpReward').textContent = currentLesson.xpReward;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="difficulty-badge diff-${currentLesson.difficulty.toLowerCase()}">${currentLesson.difficulty}</span>
                        <span class="text-sm text-gray-400">${currentLesson.category}</span>
                    </div>
                    <div class="text-gray-300 leading-relaxed">
                        ${currentLesson.content}
                        
                        <div class="mt-6 p-4 border border-gray-600 rounded">
                            <h4 class="text-lg text-glow-purple mb-2">Key Concepts:</h4>
                            <ul class="list-disc list-inside space-y-1 text-sm">
                                <li>Understanding the data structure</li>
                                <li>Common operations and their time complexity</li>
                                <li>Real-world applications</li>
                                <li>Implementation techniques</li>
                            </ul>
                        </div>
                        
                        <div class="mt-4 p-4 bg-blue-900 bg-opacity-30 rounded">
                            <h4 class="text-lg text-glow-cyan mb-2">💡 Pro Tip:</h4>
                            <p class="text-sm">Practice implementing this concept in your preferred programming language to solidify your understanding!</p>
                        </div>
                    </div>
                </div>
            `;

            const completeBtn = document.getElementById('completeBtn');
            if (currentLesson.completed) {
                completeBtn.textContent = 'COMPLETED ✅';
                completeBtn.disabled = true;
                completeBtn.style.opacity = '0.5';
            } else {
                completeBtn.textContent = 'COMPLETE LESSON';
                completeBtn.disabled = false;
                completeBtn.style.opacity = '1';
            }

            document.getElementById('lessonModal').classList.remove('hidden');
        }

        async function completeLesson() {
            if (!currentLesson || currentLesson.completed) return;

            try {
                const response = await fetch(`${API_BASE}/api/lessons/${currentLesson.id}/complete`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();
                
                if (result.success) {
                    currentLesson.completed = true;
                    alert(`🎉 ${result.message}`);
                    document.getElementById('lessonModal').classList.add('hidden');
                    renderLessons();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Complete lesson error:', error);
                alert('Failed to complete lesson');
            }
        }

        // Event listeners
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('lessonModal').classList.add('hidden');
        });

        document.getElementById('completeBtn').addEventListener('click', completeLesson);

        // Category filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.category;
                renderLessons();
            });
        });

        // Close modal on outside click
        document.getElementById('lessonModal').addEventListener('click', (e) => {
            if (e.target.id === 'lessonModal') {
                document.getElementById('lessonModal').classList.add('hidden');
            }
        });

        loadLessons();
    </script>
</body>
</html>
