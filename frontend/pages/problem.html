<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem - Codecade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background: #000 url('/assets/images/background.jpg') center center / cover no-repeat fixed;
            color: #e0e0e0;
            font-size: 1.1rem;
        }

        .retro-panel {
            background: linear-gradient(135deg, rgba(75, 46, 114, 0.9), rgba(46, 26, 71, 0.9));
            border: 4px solid #9932cc;
            box-shadow: 0 0 15px #9932cc;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .retro-btn {
            font-family: 'VT323', monospace;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border: 3px solid #da70d6;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            color: #da70d6;
            background: transparent;
        }

        .retro-btn:hover {
            background: #da70d6;
            color: #1a0a2e;
            box-shadow: 0 0 20px #da70d6;
        }

        .retro-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .retro-btn-success {
            border-color: #00ff00;
            color: #00ff00;
        }

        .retro-btn-success:hover {
            background: #00ff00;
            color: #000;
        }

        .code-editor {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: #0a0a23;
            color: #e0e0e0;
            border: 2px solid #da70d6;
            border-radius: 8px;
            padding: 1rem;
            width: 100%;
            height: 400px;
            resize: vertical;
            outline: none;
            box-shadow: 0 0 10px #da70d6;
        }

        .output-panel {
            background: #000;
            border: 2px solid #9932cc;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #00ff00;
            height: 200px;
            overflow-y: auto;
        }

        .text-glow-pink { color: #ff1493; text-shadow: 0 0 10px #ff1493; }
        .text-glow-purple { color: #9932cc; text-shadow: 0 0 10px #9932cc; }
        .text-glow-cyan { color: #67e8f9; text-shadow: 0 0 10px #06b6d4; }

        .diff-easy { color: #10b981; border: 2px solid #10b981; background: rgba(16, 185, 129, 0.1); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .diff-medium { color: #f59e0b; border: 2px solid #f59e0b; background: rgba(245, 158, 11, 0.1); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .diff-hard { color: #ef4444; border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.1); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }

        .tab-button {
            padding: 0.5rem 1rem;
            border: 2px solid #9932cc;
            background: transparent;
            color: #9932cc;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            margin-right: 2px;
        }

        .tab-button.active {
            background: #9932cc;
            color: #1a0a2e;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .test-case {
            border: 1px solid #444;
            border-radius: 4px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }

        .test-case.passed {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .test-case.failed {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .success-message {
            color: #00ff00;
        }

        .error-message {
            color: #ff0000;
        }

        .info-message {
            color: #67e8f9;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="retro-panel">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl text-glow-pink" id="problemTitle">Loading Problem...</h1>
                <span id="difficultyBadge" class="diff-easy">Easy</span>
            </div>
            <div class="flex gap-2">
                <a href="practice-new.html" class="retro-btn text-sm">← BACK</a>
                <button id="resetBtn" class="retro-btn text-sm">RESET</button>
            </div>
        </div>
    </header>

    <div class="flex flex-col xl:flex-row gap-4 px-4">
        <!-- Problem Statement -->
        <div class="w-full xl:w-1/2">
            <div class="retro-panel">
                <div id="problemStatement">
                    <div class="animate-pulse">
                        <div class="h-4 bg-gray-600 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-gray-600 rounded w-1/2 mb-4"></div>
                        <div class="h-20 bg-gray-600 rounded mb-4"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Code Editor -->
        <div class="w-full xl:w-1/2">
            <div class="retro-panel">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg text-glow-purple font-bold">CODE EDITOR</h3>
                    <div class="flex gap-2">
                        <select id="languageSelect" class="bg-gray-800 border border-gray-600 text-white px-2 py-1 rounded">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                </div>
                <textarea id="codeEditor" class="code-editor" placeholder="// Write your code here..."></textarea>
                <div class="flex justify-between items-center mt-3">
                    <div class="flex gap-2">
                        <button id="runBtn" class="retro-btn">▶️ RUN</button>
                        <button id="submitBtn" class="retro-btn retro-btn-success">🚀 SUBMIT</button>
                    </div>
                    <div class="text-sm text-gray-400">
                        <span id="timer">00:00</span>
                    </div>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="retro-panel">
                <div class="flex gap-1 mb-3">
                    <button class="tab-button active" data-tab="output">Output</button>
                    <button class="tab-button" data-tab="tests">Test Cases</button>
                </div>
                
                <div id="outputTab" class="tab-content active">
                    <div id="outputPanel" class="output-panel">
                        <span class="text-gray-500">Run your code to see output...</span>
                    </div>
                </div>
                
                <div id="testsTab" class="tab-content">
                    <div id="testCases" class="max-h-48 overflow-y-auto">
                        <div class="text-center text-gray-500 py-8">Run your code to see test results.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const AUTH_TOKEN = localStorage.getItem('token') || '';
        
        if (!AUTH_TOKEN) {
            window.location.href = 'index.html';
        }

        let currentProblem = null;
        let startTime = Date.now();
        let timerInterval = null;

        // Get problem ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const problemId = urlParams.get('id');

        if (!problemId) {
            window.location.href = 'practice-new.html';
        }

        // Code templates
        const codeTemplates = {
            'two-sum': {
                javascript: `var twoSum = function(nums, target) {
    // Write your solution here
    
};`,
                python: `class Solution:
    def twoSum(self, nums, target):
        # Write your solution here
        pass`,
                java: `class Solution {
    public int[] twoSum(int[] nums, int target) {
        // Write your solution here
        
    }
}`,
                cpp: `class Solution {
public:
    vector<int> twoSum(vector<int>& nums, int target) {
        // Write your solution here
        
    }
};`
            },
            'reverse-string': {
                javascript: `var reverseString = function(s) {
    // Write your solution here
    
};`,
                python: `class Solution:
    def reverseString(self, s):
        # Write your solution here
        pass`,
                java: `class Solution {
    public void reverseString(char[] s) {
        // Write your solution here
        
    }
}`,
                cpp: `class Solution {
public:
    void reverseString(vector<char>& s) {
        // Write your solution here
        
    }
};`
            },
            'palindrome-number': {
                javascript: `var isPalindrome = function(x) {
    // Write your solution here
    
};`,
                python: `class Solution:
    def isPalindrome(self, x):
        # Write your solution here
        pass`,
                java: `class Solution {
    public boolean isPalindrome(int x) {
        // Write your solution here
        
    }
}`,
                cpp: `class Solution {
public:
    bool isPalindrome(int x) {
        // Write your solution here
        
    }
};`
            },
            'valid-parentheses': {
                javascript: `var isValid = function(s) {
    // Write your solution here
    
};`,
                python: `class Solution:
    def isValid(self, s):
        # Write your solution here
        pass`,
                java: `class Solution {
    public boolean isValid(String s) {
        // Write your solution here
        
    }
}`,
                cpp: `class Solution {
public:
    bool isValid(string s) {
        // Write your solution here
        
    }
};`
            },
            'merge-sorted-arrays': {
                javascript: `var mergeTwoLists = function(list1, list2) {
    // Write your solution here
    
};`,
                python: `class Solution:
    def mergeTwoLists(self, list1, list2):
        # Write your solution here
        pass`,
                java: `class Solution {
    public ListNode mergeTwoLists(ListNode list1, ListNode list2) {
        // Write your solution here
        
    }
}`,
                cpp: `class Solution {
public:
    ListNode* mergeTwoLists(ListNode* list1, ListNode* list2) {
        // Write your solution here
        
    }
};`
            }
        };

        async function loadProblem() {
            try {
                const response = await fetch(`${API_BASE}/api/problems/${problemId}`);
                const problem = await response.json();
                
                currentProblem = problem;
                
                document.getElementById('problemTitle').textContent = problem.title;
                document.getElementById('difficultyBadge').textContent = problem.difficulty;
                document.getElementById('difficultyBadge').className = `diff-${problem.difficulty.toLowerCase()}`;
                
                document.getElementById('problemStatement').innerHTML = `
                    <h3 class="text-xl text-glow-cyan mb-4">Problem Description</h3>
                    <p class="text-gray-300 mb-6 leading-relaxed">${problem.description}</p>
                    
                    <h4 class="text-lg text-glow-purple mb-3">Examples</h4>
                    ${problem.examples.map((example, i) => `
                        <div class="bg-gray-800 p-4 rounded mb-4">
                            <div class="font-bold mb-2">Example ${i + 1}:</div>
                            <div class="mb-1"><strong>Input:</strong> <code class="text-blue-300">${example.input}</code></div>
                            <div class="mb-1"><strong>Output:</strong> <code class="text-green-300">${example.output}</code></div>
                            ${example.explanation ? `<div class="text-sm text-gray-400 mt-2">${example.explanation}</div>` : ''}
                        </div>
                    `).join('')}
                    
                    <h4 class="text-lg text-glow-purple mb-3">Constraints</h4>
                    <ul class="list-disc list-inside text-gray-300 space-y-1">
                        ${problem.constraints.map(constraint => `<li>${constraint}</li>`).join('')}
                    </ul>
                `;

                updateCodeTemplate();
                startTimer();
                
            } catch (error) {
                console.error('Failed to load problem:', error);
                document.getElementById('problemStatement').innerHTML = `
                    <div class="text-red-400">Failed to load problem. Please try again.</div>
                `;
            }
        }

        function updateCodeTemplate() {
            const language = document.getElementById('languageSelect').value;
            const template = codeTemplates[problemId]?.[language] || '// Write your solution here';
            document.getElementById('codeEditor').value = template;
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const language = document.getElementById('languageSelect').value;
            
            if (!code.trim()) {
                showOutput('Please write some code first.', 'error');
                return;
            }

            switchTab('output');
            showOutput('🔄 Compiling and running code...', 'info');
            setLoading(true);

            try {
                const response = await fetch(`${API_BASE}/api/execute/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({ code, language })
                });

                const result = await response.json();
                
                if (result.error) {
                    // Show compilation or runtime errors
                    showOutput(`❌ Error:\n\n${result.output}`, 'error');
                } else {
                    // Show successful output
                    showOutput(`✅ Output:\n\n${result.output}\n\n💡 Use SUBMIT to save your solution.`, 'success');
                    renderTestCases([
                        { input: 'Your Code', expected: 'Output', actual: result.output.trim(), passed: true }
                    ]);
                }
                
            } catch (error) {
                console.error('Execution error:', error);
                showOutput('🚫 Failed to execute code. Please check your syntax and try again.', 'error');
            } finally {
                setLoading(false);
            }
        }

        async function submitCode() {
            const code = document.getElementById('codeEditor').value;
            const language = document.getElementById('languageSelect').value;
            
            if (!code.trim()) {
                showOutput('Please write some code first.', 'error');
                return;
            }

            if (!confirm('Submit your solution for evaluation?')) {
                return;
            }

            switchTab('output');
            showOutput('🚀 Submitting solution...', 'info');
            setLoading(true);

            try {
                const response = await fetch(`${API_BASE}/api/problems/${problemId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({ solution: code, language })
                });

                if (!response.ok) {
                    const error = await response.json();
                    showOutput(`🚫 ${error.error || 'Submission failed'}`, 'error');
                    return;
                }
                
                const result = await response.json();
                
                if (result.success) {
                    const timeSpent = Math.floor((Date.now() - startTime) / 1000);
                    showOutput(`🏆 ACCEPTED! Problem solved successfully!\n\n⚡ Performance:\n• Time: ${timeSpent}s\n• XP Gained: +${result.xpGained}\n\n🎯 Great job! Keep practicing!`, 'success');
                    
                    // Update submit button
                    document.getElementById('submitBtn').textContent = '✅ SOLVED';
                    document.getElementById('submitBtn').disabled = true;
                    
                    clearInterval(timerInterval);
                } else {
                    showOutput(`❌ ${result.message}\n\nPlease review your solution and try again.`, 'error');
                }
                
            } catch (error) {
                console.error('Submit error:', error);
                showOutput('🚫 Submission failed. Please try again.', 'error');
            } finally {
                setLoading(false);
            }
        }

        function renderTestCases(testResults) {
            const container = document.getElementById('testCases');
            
            if (!testResults.length) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">No test results available.</div>';
                return;
            }
            
            container.innerHTML = testResults.map((test, i) => `
                <div class="test-case ${test.passed ? 'passed' : 'failed'}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium">${test.passed ? '✅' : '❌'} Test Case ${i + 1}</span>
                        <span class="${test.passed ? 'text-green-400' : 'text-red-400'} font-medium">
                            ${test.passed ? 'PASSED' : 'FAILED'}
                        </span>
                    </div>
                    <div class="text-xs space-y-1">
                        <div><span class="text-gray-400">Input:</span> <code>${test.input}</code></div>
                        <div><span class="text-gray-400">Expected:</span> <code class="text-green-300">${test.expected}</code></div>
                        <div><span class="text-gray-400">Actual:</span> <code class="${test.passed ? 'text-green-300' : 'text-red-300'}">${test.actual}</code></div>
                    </div>
                </div>
            `).join('');
        }

        function showOutput(message, type = 'info') {
            const panel = document.getElementById('outputPanel');
            const className = type === 'success' ? 'success-message' : 
                            type === 'error' ? 'error-message' : 'info-message';
            panel.innerHTML = `<div class="${className}">${message}</div>`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
        }

        function setLoading(loading) {
            const buttons = ['runBtn', 'submitBtn'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if (loading) {
                    btn.classList.add('loading');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            });
        }

        function resetEditor() {
            updateCodeTemplate();
            document.getElementById('outputPanel').innerHTML = '<span class="text-gray-500">Run your code to see output...</span>';
            document.getElementById('testCases').innerHTML = '<div class="text-center text-gray-500 py-8">Run your code to see test results.</div>';
        }

        // Event listeners
        document.getElementById('runBtn').addEventListener('click', runCode);
        document.getElementById('submitBtn').addEventListener('click', submitCode);
        document.getElementById('resetBtn').addEventListener('click', resetEditor);
        document.getElementById('languageSelect').addEventListener('change', updateCodeTemplate);

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // Initialize
        loadProblem();
    </script>
</body>
</html>
