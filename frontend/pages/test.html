<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Test - Codecade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background: #000 url('/assets/images/background.jpg') center center / cover no-repeat fixed;
            color: #e0e0e0;
            font-size: 1.25rem;
        }

        .retro-panel {
            background: linear-gradient(135deg, rgba(75, 46, 114, 0.9), rgba(46, 26, 71, 0.9));
            border: 4px solid #9932cc;
            box-shadow: 0 0 15px #9932cc;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .retro-btn {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border: 3px solid #da70d6;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            color: #da70d6;
            background: transparent;
        }

        .retro-btn:hover {
            background: #da70d6;
            color: #1a0a2e;
            box-shadow: 0 0 20px #da70d6;
        }

        .text-glow-pink { color: #ff1493; text-shadow: 0 0 10px #ff1493; }
        .text-glow-purple { color: #9932cc; text-shadow: 0 0 10px #9932cc; }
        .text-glow-cyan { color: #67e8f9; text-shadow: 0 0 10px #06b6d4; }

        .question-card {
            background: rgba(75, 46, 114, 0.6);
            border: 2px solid #da70d6;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .option {
            background: rgba(46, 26, 71, 0.6);
            border: 2px solid #444;
            border-radius: 6px;
            padding: 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #da70d6;
            background: rgba(218, 112, 214, 0.1);
        }

        .option.selected {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .timer {
            font-size: 2rem;
            text-align: center;
            color: #ff1493;
            text-shadow: 0 0 10px #ff1493;
        }

        .progress-bar {
            background: #444;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ff1493, #da70d6);
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="retro-panel">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl text-glow-pink">📝 CODING TEST</h1>
            <div class="flex gap-4 items-center">
                <div class="timer" id="timer">15:00</div>
                <a href="index.html" class="retro-btn text-sm">← HOME</a>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4">
        <!-- Test Info -->
        <div id="testInfo" class="retro-panel text-center">
            <h2 class="text-2xl text-glow-cyan mb-4">5-Question Coding Assessment</h2>
            <p class="mb-4">Test your DSA knowledge with 5 carefully selected questions.</p>
            <p class="mb-6 text-yellow-400">⏱️ Time Limit: 15 minutes</p>
            <button id="startBtn" class="retro-btn text-xl">START TEST</button>
        </div>

        <!-- Progress -->
        <div id="progressSection" class="hidden mb-6">
            <div class="flex justify-between items-center mb-2">
                <span>Question <span id="currentQ">1</span> of 5</span>
                <span id="timeLeft">15:00</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 20%"></div>
            </div>
        </div>

        <!-- Question -->
        <div id="questionSection" class="hidden">
            <div class="question-card">
                <h3 class="text-xl text-glow-purple mb-4" id="questionTitle">Question 1</h3>
                <p class="mb-6" id="questionText">Loading question...</p>
                <div id="optionsContainer">
                    <!-- Options will be loaded here -->
                </div>
                <div class="flex justify-between mt-6">
                    <button id="prevBtn" class="retro-btn" disabled>PREVIOUS</button>
                    <button id="nextBtn" class="retro-btn">NEXT</button>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="resultsSection" class="hidden">
            <div class="retro-panel text-center">
                <h2 class="text-2xl text-glow-cyan mb-4">🎯 TEST COMPLETED!</h2>
                <div class="text-6xl mb-4" id="scoreDisplay">0/5</div>
                <div class="text-xl mb-6">
                    <span id="scoreText">Score: 0%</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-2xl text-green-400" id="correctCount">0</div>
                        <div class="text-sm">Correct</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-2xl text-red-400" id="wrongCount">0</div>
                        <div class="text-sm">Wrong</div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded">
                        <div class="text-2xl text-yellow-400" id="timeUsed">0:00</div>
                        <div class="text-sm">Time Used</div>
                    </div>
                </div>
                <div class="flex gap-4 justify-center">
                    <button id="retakeBtn" class="retro-btn">RETAKE TEST</button>
                    <a href="practice-new.html" class="retro-btn">PRACTICE MORE</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const AUTH_TOKEN = localStorage.getItem('token') || '';
        
        if (!AUTH_TOKEN) {
            window.location.href = 'index.html';
        }

        let questions = [];

        let currentQuestion = 0;
        let answers = [];
        let timeLeft = 15 * 60; // 15 minutes in seconds
        let timerInterval = null;
        let testStartTime = null;

        async function startTest() {
            // Fetch random questions
            try {
                const response = await fetch(`${API_BASE}/api/mcq/random?count=5`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                const data = await response.json();
                
                questions = data.map(q => ({
                    question: q.question,
                    options: typeof q.options === 'string' ? JSON.parse(q.options) : q.options,
                    correct: q.correct_answer
                }));
            } catch (error) {
                console.error('Failed to load questions:', error);
                alert('Failed to load questions. Please try again.');
                return;
            }
            
            document.getElementById('testInfo').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('questionSection').classList.remove('hidden');
            
            testStartTime = Date.now();
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    finishTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('timer').textContent = timeStr;
            document.getElementById('timeLeft').textContent = timeStr;
            
            // Change color when time is running out
            if (timeLeft < 60) {
                document.getElementById('timer').style.color = '#ff0000';
            } else if (timeLeft < 300) {
                document.getElementById('timer').style.color = '#ffff00';
            }
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            
            document.getElementById('questionTitle').textContent = `Question ${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                optionDiv.onclick = () => selectOption(index);
                
                if (answers[currentQuestion] === index) {
                    optionDiv.classList.add('selected');
                }
                
                optionsContainer.appendChild(optionDiv);
            });
            
            // Update progress
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Update buttons
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').textContent = 
                currentQuestion === questions.length - 1 ? 'FINISH' : 'NEXT';
        }

        function selectOption(index) {
            answers[currentQuestion] = index;
            
            // Update visual selection
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.querySelectorAll('.option')[index].classList.add('selected');
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                finishTest();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function finishTest() {
            clearInterval(timerInterval);
            
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('questionSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
            
            calculateResults();
        }

        function calculateResults() {
            let correct = 0;
            
            questions.forEach((q, index) => {
                if (answers[index] === q.correct) {
                    correct++;
                }
            });
            
            const wrong = questions.length - correct;
            const percentage = Math.round((correct / questions.length) * 100);
            const timeUsed = Math.floor((Date.now() - testStartTime) / 1000);
            const timeUsedStr = `${Math.floor(timeUsed / 60)}:${(timeUsed % 60).toString().padStart(2, '0')}`;
            
            document.getElementById('scoreDisplay').textContent = `${correct}/${questions.length}`;
            document.getElementById('scoreText').textContent = `Score: ${percentage}%`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('timeUsed').textContent = timeUsedStr;
            
            // Change score color based on performance
            const scoreDisplay = document.getElementById('scoreDisplay');
            if (percentage >= 80) {
                scoreDisplay.style.color = '#00ff00';
            } else if (percentage >= 60) {
                scoreDisplay.style.color = '#ffff00';
            } else {
                scoreDisplay.style.color = '#ff0000';
            }
        }

        function retakeTest() {
            currentQuestion = 0;
            answers = [];
            timeLeft = 15 * 60;
            
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('testInfo').classList.remove('hidden');
            document.getElementById('timer').style.color = '#ff1493';
            document.getElementById('timer').textContent = '15:00';
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startTest);
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('prevBtn').addEventListener('click', prevQuestion);
        document.getElementById('retakeBtn').addEventListener('click', retakeTest);
    </script>
</body>
</html>
